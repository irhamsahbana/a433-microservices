# Di-expose lewat NodePort tetap supaya VUE_APP_BACKEND di frontend bisa
# nunjuk ke <Node_IP>:<Node_Port> yang pasti, bukan port acak.
apiVersion: v1
kind: Service
metadata:
  name: karsajobs
  namespace: karsajobs
  labels:
    app: karsajobs
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
  selector:
    app: karsajobs
