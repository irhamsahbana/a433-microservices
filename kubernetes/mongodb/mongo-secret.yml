# Menyimpan kredensial root MongoDB dalam bentuk base64. Di-mount ke
# StatefulSet sebagai file (lihat mongo-statefulset.yml) dan dipakai juga
# oleh Deployment backend sebagai env var biasa untuk connection string-nya.
apiVersion: v1
kind: Secret
metadata:
  name: mongo-secret
  namespace: karsajobs
type: Opaque
data:
  # admin
  MONGO_ROOT_USERNAME: YWRtaW4=
  # supersecretpassword
  MONGO_ROOT_PASSWORD: c3VwZXJzZWNyZXRwYXNzd29yZA==
