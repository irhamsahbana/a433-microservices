# Holds MongoDB root credentials as base64-encoded values. Mounted into the
# StatefulSet as files (see mongo-statefulset.yml) and referenced by the
# backend Deployment as plain env vars for its own connection string.
apiVersion: v1
kind: Secret
metadata:
  name: mongo-secret
  namespace: karsajobs
type: Opaque
data:
  # admin
  MONGO_ROOT_USERNAME: YWRtaW4=
  # supersecretpassword
  MONGO_ROOT_PASSWORD: c3VwZXJzZWNyZXRwYXNzd29yZA==
