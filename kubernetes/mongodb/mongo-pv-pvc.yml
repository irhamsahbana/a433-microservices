# PersistentVolume yang dibuat manual (pakai hostPath di node minikube) dan
# PersistentVolumeClaim yang di-bind oleh StatefulSet, di-mount ke /data/db
# supaya data Mongo tetap ada meskipun pod restart.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mongo-pv-volume
  labels:
    type: local
spec:
  storageClassName: manual
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/mnt/data/mongo"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-pv-claim
  namespace: karsajobs
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
