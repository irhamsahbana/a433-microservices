# Berkas config buat mongod. Di-mount ke /config di StatefulSet; mongod
# dijalankan dengan --config yang menunjuk ke dbPath di berkas ini.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongo-configmap
  namespace: karsajobs
data:
  mongo.conf: |
    storage:
      dbPath: /data/db
    net:
      # Karena mongod dijalankan langsung (bukan lewat entrypoint script
      # bawaan image-nya), default bind_ip_all jadi ke-skip, jadi ini harus
      # di-set manual, kalau nggak backend nggak bisa akses Mongo lewat
      # jaringan cluster.
      bindIp: 0.0.0.0
