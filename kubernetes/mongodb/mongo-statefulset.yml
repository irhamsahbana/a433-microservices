# StatefulSet bikin Mongo punya identitas yang stabil, didukung PV/PVC yang
# udah didefinisikan di mongo-pv-pvc.yml.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: karsajobs
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:4.4
          # Config di-pass lewat args aja (tanpa override `command`) biar
          # docker-entrypoint.sh bawaan image-nya tetap jalan — itu yang
          # sebenarnya bikin root user dari env var *_FILE di bawah ini.
          args: ["--config", "/config/mongo.conf"]
          ports:
            - containerPort: 27017
          env:
            # Kredensial root dibaca dari file, bukan env var biasa, jadi
            # nilai secret aslinya nggak bakal kelihatan di `kubectl describe`.
            - name: MONGO_INITDB_ROOT_USERNAME_FILE
              value: /etc/mongo-credentials/MONGO_ROOT_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD_FILE
              value: /etc/mongo-credentials/MONGO_ROOT_PASSWORD
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
            - name: mongo-config
              mountPath: /config
            - name: mongo-credentials
              mountPath: /etc/mongo-credentials
              readOnly: true
      volumes:
        - name: mongo-data
          persistentVolumeClaim:
            claimName: mongo-pv-claim
        - name: mongo-config
          configMap:
            name: mongo-configmap
        - name: mongo-credentials
          secret:
            secretName: mongo-secret
