# StatefulSet gives Mongo a stable identity, backed by the PV/PVC defined
# in mongo-pv-pvc.yml.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: karsajobs
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:4.4
          # Pass the config via args only (no `command` override) so the
          # image's docker-entrypoint.sh still runs — it's what actually
          # creates the root user from the *_FILE env vars below.
          args: ["--config", "/config/mongo.conf"]
          ports:
            - containerPort: 27017
          env:
            # Root credentials are read from files, not plain env vars,
            # so the actual secret values never show up in `kubectl describe`.
            - name: MONGO_INITDB_ROOT_USERNAME_FILE
              value: /etc/mongo-credentials/MONGO_ROOT_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD_FILE
              value: /etc/mongo-credentials/MONGO_ROOT_PASSWORD
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
            - name: mongo-config
              mountPath: /config
            - name: mongo-credentials
              mountPath: /etc/mongo-credentials
              readOnly: true
      volumes:
        - name: mongo-data
          persistentVolumeClaim:
            claimName: mongo-pv-claim
        - name: mongo-config
          configMap:
            name: mongo-configmap
        - name: mongo-credentials
          secret:
            secretName: mongo-secret
