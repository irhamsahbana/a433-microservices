# Istio VirtualService: atur routing trafik yang masuk lewat Gateway.
# Request ke path persis "/order" diarahkan ke Service order-service, dan
# path berawalan "/shipping" diarahkan ke Service shipping-service.
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: ecommerce-vs
  namespace: ecommerce
spec:
  hosts:
    - "*"
  gateways:
    # Nyambung ke Gateway yang didefinisikan di gateway.yml
    - ecommerce-gateway
  http:
    - match:
        - uri:
            # Cuma path "/order" persis yang di-match (sesuai ketentuan tips)
            exact: /order
      route:
        - destination:
            # Nama Kubernetes Service buat order-service
            host: order-service
            port:
              number: 3000
    - match:
        - uri:
            # Semua path yang diawali "/shipping" (misal /shipping/health)
            prefix: /shipping
      route:
        - destination:
            # Nama Kubernetes Service buat shipping-service
            host: shipping-service
            port:
              number: 3001
