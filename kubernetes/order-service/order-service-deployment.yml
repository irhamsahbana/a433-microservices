# Deployment buat order-service. Image-nya diambil dari GHCR (bukan
# image lokal), sesuai kriteria 3.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: ecommerce
  labels:
    app: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          # Tag versi spesifik (bukan "latest") biar image immutable dan
          # gampang di-rollback ke versi tertentu kalau ada masalah
          image: ghcr.io/irhamsahbana/order-service:v1.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          # PORT (non-sensitif) dari ConfigMap, AMQP_URL (ada password) dari Secret
          envFrom:
            - configMapRef:
                name: order-service-config
            - secretRef:
                name: order-service-secret
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          # Restart pod otomatis kalau proses Node-nya macet/gak respons lagi
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          # Baru dikasih trafik kalau koneksi RabbitMQ-nya udah kebentuk
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
