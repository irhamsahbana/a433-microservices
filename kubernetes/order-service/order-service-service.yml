# Service ClusterIP buat order-service. Cukup ClusterIP karena akses dari
# luar cluster nanti lewat Istio Ingress Gateway, bukan NodePort langsung.
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: ecommerce
  labels:
    app: order-service
spec:
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: order-service
