# Deployment buat frontend. VUE_APP_BACKEND udah ke-bake ke dalam image
# pas build time (lihat build_push_image_karsajobs_ui.sh / .env), jadi
# gak perlu env var lagi pas runtime.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: karsajobs-ui
  namespace: karsajobs
  labels:
    app: karsajobs-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: karsajobs-ui
  template:
    metadata:
      labels:
        app: karsajobs-ui
    spec:
      containers:
        - name: karsajobs-ui
          image: ghcr.io/irhamsahbana/karsajobs-ui:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 768Mi
          ports:
            - containerPort: 8000
