# NodePort tetap supaya app-nya bisa diakses dari browser lewat
# <Node_IP>:30000 yang pasti.
apiVersion: v1
kind: Service
metadata:
  name: karsajobs-ui
  namespace: karsajobs
  labels:
    app: karsajobs-ui
spec:
  type: NodePort
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30000
  selector:
    app: karsajobs-ui
