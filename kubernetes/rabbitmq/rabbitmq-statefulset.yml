# StatefulSet buat RabbitMQ server, pakai image resmi yang sudah termasuk
# plugin management (dashboard web).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: ecommerce
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          # Image RabbitMQ yang diwajibkan di kriteria, sudah termasuk plugin management
          image: rabbitmq:3.11-management
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Cek kesiapan RabbitMQ lewat perintah bawaan image-nya
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 5
            # Default timeout (1s) kependekan buat rabbitmq-diagnostics, jadi dilonggarin
            timeoutSeconds: 10
