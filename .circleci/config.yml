version: 2.1

jobs:
  # Install hadolint terus jalanin buat cek Dockerfile-nya sesuai best practice
  lint-dockerfile:
    docker:
      - image: cimg/base:2024.02
    steps:
      - checkout
      - run:
          name: Install hadolint
          command: |
            wget -O /tmp/hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
            chmod +x /tmp/hadolint
      - run:
          name: Lint Dockerfile
          command: /tmp/hadolint Dockerfile

  # Build image frontend terus push ke GHCR lewat shell script
  build-app-karsajobs-ui:
    docker:
      - image: cimg/base:2024.02
    steps:
      - checkout
      - setup_remote_docker:
          version: default
      - run:
          name: Build and push image
          command: |
            chmod +x build_push_image_karsajobs_ui.sh
            ./build_push_image_karsajobs_ui.sh "$CIRCLE_SHA1"

workflows:
  karsajobs-ui-pipeline:
    jobs:
      - lint-dockerfile:
          filters:
            branches:
              only: karsajobs-ui
      - build-app-karsajobs-ui:
          requires:
            - lint-dockerfile
          filters:
            branches:
              only: karsajobs-ui
