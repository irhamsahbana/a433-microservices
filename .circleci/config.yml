version: 2.1

jobs:
  # Installs hadolint and lints the Dockerfile for best-practice issues
  lint-dockerfile:
    docker:
      - image: cimg/base:2024.02
    steps:
      - checkout
      - run:
          name: Install hadolint
          command: |
            wget -O /tmp/hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
            chmod +x /tmp/hadolint
      - run:
          name: Lint Dockerfile
          command: /tmp/hadolint Dockerfile

  # Runs the backend unit tests, matching the go.mod toolchain version
  test-app:
    docker:
      - image: golang:1.15
    steps:
      - checkout
      - run:
          name: Run unit tests
          command: go test -v -short --count=1 $(go list ./...)

  # Builds the backend image and pushes it to GHCR via the shell script
  build-app-karsajobs:
    docker:
      - image: cimg/base:2024.02
    steps:
      - checkout
      - setup_remote_docker:
          version: default
      - run:
          name: Build and push image
          command: |
            chmod +x build_push_image_karsajobs.sh
            ./build_push_image_karsajobs.sh "$CIRCLE_SHA1"

workflows:
  karsajobs-pipeline:
    jobs:
      - lint-dockerfile:
          filters:
            branches:
              only: karsajobs
      - test-app:
          filters:
            branches:
              only: karsajobs
      - build-app-karsajobs:
          requires:
            - lint-dockerfile
            - test-app
          filters:
            branches:
              only: karsajobs
